<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>desktop-tutorial</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fa;
      color: #1f2328;
    }
    main {
      max-width: 720px;
      background: white;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 16px 40px rgba(31, 35, 40, 0.08);
    }
    h1 { margin: 0 0 16px; font-size: 36px; }
    p { margin: 0 0 18px; font-size: 18px; line-height: 1.7; }
    a { color: #0969da; }
  </style>

<body>
  <main>
    <h1>desktop-tutorial</h1>
    <p>这个页面已经通过 GitHub Pages 发布，可以用浏览器链接分享给别人访问。</p>
    <p>后续把真正的网站文件上传到这个仓库，并保持首页文件名为 <strong>index.html</strong>，这个链接就会显示你的正式网站。</p>
    <p><a href="https://github.com/moliere1/desktop-tutorial">查看 GitHub 仓库</a></p>
  </main>
